name: Update Spotify Now Playing

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

  workflow_dispatch:

concurrency:
  group: spotify-now-playing
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-spotify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Spotify access token
        id: token
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          set -e

          RESPONSE=$(curl -sS -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=${SPOTIFY_REFRESH_TOKEN}" \
            --data-urlencode "client_id=${SPOTIFY_CLIENT_ID}" \
            "https://accounts.spotify.com/api/token")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Spotify access token alınamadı."
            echo "$RESPONSE" | jq .
            exit 1
          fi

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Get currently playing track
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          set -e

          HTTP_CODE=$(curl -sS \
            -o spotify-response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://api.spotify.com/v1/me/player/currently-playing")

          echo "Spotify response: ${HTTP_CODE}"

          if [ -f spotify.json ] && jq -e . spotify.json >/dev/null 2>&1; then
            LAST_PLAYED=$(jq '.lastPlayed // null' spotify.json)
          else
            LAST_PLAYED="null"
          fi

          if [ "$HTTP_CODE" = "204" ]; then

            cat > spotify.json <<EOF
          {
            "isPlaying": false,
            "track": null,
            "artist": null,
            "album": null,
            "albumImage": null,
            "spotifyUrl": null,
            "progressMs": 0,
            "durationMs": 0,
            "updatedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "lastPlayed": $LAST_PLAYED
          }
          EOF

          elif [ "$HTTP_CODE" = "200" ]; then

            jq \
              --argjson previousLastPlayed "$LAST_PLAYED" \
              '{
                isPlaying: (.is_playing // false),
                track: (.item.name // null),
                artist: (
                  if .item.artists then
                    (.item.artists | map(.name) | join(", "))
                  else
                    null
                  end
                ),
                album: (.item.album.name // null),
                albumImage: (
                  if .item.album.images and (.item.album.images | length) > 0
                  then .item.album.images[0].url
                  else null
                  end
                ),
                spotifyUrl: (.item.external_urls.spotify // null),
                progressMs: (.progress_ms // 0),
                durationMs: (.item.duration_ms // 0),
                updatedAt: (now | todateiso8601),
                lastPlayed: {
                  track: (.item.name // null),
                  artist: (
                    if .item.artists then
                      (.item.artists | map(.name) | join(", "))
                    else
                      null
                    end
                  ),
                  album: (.item.album.name // null),
                  albumImage: (
                    if .item.album.images and (.item.album.images | length) > 0
                    then .item.album.images[0].url
                    else null
                    end
                  ),
                  spotifyUrl: (.item.external_urls.spotify // null)
                }
              }' spotify-response.json > spotify.json.tmp

            mv spotify.json.tmp spotify.json

          else

            echo "Spotify API beklenmeyen HTTP kodu döndürdü: ${HTTP_CODE}"
            cat spotify-response.json
            exit 1

          fi

      - name: Commit spotify.json
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add spotify.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi

          git commit -m "Update Spotify now playing"

          git pull --rebase origin main

          git push
